<div class="leaderboard-container">
  
  <!-- 1. Owner Highlight Box ganz oben -->
  <div class="owner-card">
    <div class="owner-badge">👑 Owner & Creator</div>
    <div class="owner-info">
      <h3>LionKIng</h3>
      <div class="owner-stats">
        <span class="stat-xp">⚡ 99,999 XP</span>
        <span class="stat-coins">🪙 50,000 Münzen</span>
      </div>
    </div>
  </div>

  <!-- 2. Kategorie-Tabs (XP / Münzen) -->
  <div class="leaderboard-tabs">
    <button id="tab-xp" class="tab-btn active" onclick="setCategory('xp')">⚡ Top XP</button>
    <button id="tab-coins" class="tab-btn" onclick="setCategory('coins')">🪙 Top Münzen</button>
  </div>

  <!-- 3. Top 10 Rangliste -->
  <div class="leaderboard-list" id="leaderboard-list">
    <!-- Wird dynamisch per JavaScript befüllt -->
  </div>

  <!-- 4. Eigener Rang (falls außerhalb der Top 10) -->
  <div class="user-rank-card" id="user-rank-card">
    <!-- Wird dynamisch per JavaScript befüllt -->
  </div>

</div>
